; sqwrtr – ESP8266 beregeningscontroller
; Eerste keer:   pio run -e usb -t upload
; Daarna (OTA):  set SQWRTR_OTA_PASS=... && pio run -e ota -t upload

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.ldscript = eagle.flash.4m1m.ld   ; 4 MB flash, ~1 MB LittleFS
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DFW_VERSION=\"0.2.0\"
    -DCONSOLE_ENABLED=1   ; serieel testconsole op RX; 0 zodra flowmeter op RX zit
    -Wall

[env:usb]
upload_speed = 460800

[env:ota]
upload_protocol = espota
; IP i.p.v. sqwrtr.local: Python op Windows kan mDNS-namen vaak niet resolven.
; Vast IP via DHCP-reservering in de router. Eenmalig anders: --upload-port <ip>
upload_port = 192.168.178.162
upload_flags =
    --auth=${sysenv.SQWRTR_OTA_PASS}
    --host_port=8270   ; vaste poort waar de ESP naar terugverbindt (firewallregel)
