; sqwrtr – ESP8266 irrigation controller
; First time:    pio run -e usb -t upload
; After that (OTA):  set SQWRTR_OTA_PASS=... && pio run -e ota -t upload

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.ldscript = eagle.flash.4m1m.ld   ; 4 MB flash, ~1 MB LittleFS
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:tools/build_web.py   ; web/index.html -> include/web_ui.h (gzip)
monitor_filters = esp8266_exception_decoder, time
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DFW_VERSION=\"0.7.0\"
    -DEMC_MIN_FREE_MEMORY=8192      ; espMqttClient: refuse publishes below this heap
    -DEMC_RX_BUFFER_SIZE=512        ; incoming commands are small
    -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
    -DCONSOLE_ENABLED=1   ; serial test console on RX; 0 once the flow meter is on RX
    -Wall
lib_deps =
    ESP32Async/ESPAsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7
    bertmelis/espMqttClient

[env:usb]
upload_speed = 460800

[env:ota]
upload_protocol = espota
; IP instead of sqwrtr.local: Python on Windows often can't resolve mDNS names.
; Fixed IP via a DHCP reservation in the router. One-off override: --upload-port <ip>
upload_port = 192.168.178.162
upload_flags =
    --auth=${sysenv.SQWRTR_OTA_PASS}
    --host_port=8270   ; fixed port the ESP connects back to (firewall rule)
